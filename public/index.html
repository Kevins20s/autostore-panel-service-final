<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GevraStore Panel</title><meta name="description" content="Panel GevraStore: kelola bot, produk, dan stok tokomu dengan key dari penjual."><meta name="theme-color" content="#080b12"><meta name="color-scheme" content="dark"><meta property="og:type" content="website"><meta property="og:site_name" content="GevraStore"><meta property="og:title" content="GevraStore Panel"><meta property="og:description" content="Masuk dengan key dari penjual untuk mengelola bot dan toko kamu."><meta property="og:image" content="https://panel.gevrastore.my.id/logo.png"><meta property="og:url" content="https://panel.gevrastore.my.id/"><meta name="twitter:card" content="summary"><link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><link rel="stylesheet" href="/style.css"><script src="/ui-extras.js"></script></head>
<body>
<section id="login" class="login hide">
  <div class="login-logo"><img src="/logo.png" alt="Logo AutoStore" width="132" height="132"></div>
  <h1>GevraStore Panel</h1><p class="mut">Masuk dengan key yang kamu terima dari penjual.</p>
  <div class="card">
    <div class="key-wrap"><input id="key" type="password" placeholder="AS-XXXX-XXXX-XXXX-XXXX atau SV-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false"></div>
    <div class="row" style="margin-top:12px"><button class="pri" id="btnLogin">Masuk</button></div>
    <div id="loginMsg" class="msg"></div>
  </div>
  <p class="login-help">Belum punya key? <span id="contactSlot">Hubungi penjual.</span></p>
</section>
<div id="app" class="app hide">
  <aside class="side">
    <div class="brand">GevraStore</div>
    <nav id="nav"></nav>
    <div class="sidefoot"><span id="botState" class="badge"></span><button id="btnOut">Keluar</button></div>
  </aside>
  <div class="content"><div id="view"></div></div>
</div>
<div id="toast"></div>
<script src="/app.js"></script>
<script src="/login-extras.js"></script>
</body></html>
