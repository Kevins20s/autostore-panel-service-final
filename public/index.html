<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GevraStore Panel</title><link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head>
<body>
<section id="login" class="login hide">
  <div class="login-logo"><img src="/logo.png" alt="Logo AutoStore" width="132" height="132"></div>
  <h1>GevraStore Panel</h1><p class="mut">Masuk dengan key yang kamu terima dari penjual.</p>
  <div class="card">
    <div class="key-wrap"><input id="key" type="password" placeholder="AS-XXXX-XXXX-XXXX-XXXX atau SV-XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" aria-label="Key akses"></div>
    <div class="row mt"><button class="pri" id="btnLogin">Masuk</button></div>
    <div id="loginMsg" class="msg" role="alert"></div>
  </div>
</section>
<div id="app" class="app hide">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="topbar-brand">GevraStore</span>
    <span id="botStateTop" class="badge"></span>
  </header>
  <aside class="side" id="side">
    <div class="brand">GevraStore</div>
    <nav id="nav" aria-label="Menu utama"></nav>
    <div class="sidefoot"><span id="botState" class="badge"></span><button id="btnOut">Keluar</button></div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <main class="content"><div id="banner" class="hide"></div><div id="view"></div></main>
</div>
<div id="toast"></div>
<script src="/ui.js"></script>
<script src="/app.js"></script>
<script src="/login-extras.js"></script>
</body></html>
